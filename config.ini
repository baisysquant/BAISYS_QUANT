# ============================================================
# 📊 业务配置
# ============================================================


[USER_FOCUS_STOCKS]
# ── 用户关注股池（竖线分隔，无需 SZ/SH 前缀） ──
user_focus_stocks = 002517|002206|600312|002415|603225


[TECHNICAL_INDICATORS]
# ── MACD 参数 ──
# [短线敏感]  6,13,5   — 信号响应最快
# [中线均衡] 12,26,9   — 经典配置（默认）
# [长线趋势] 24,52,18  — 周线级别趋势跟踪
macd_params = 12,26,9


[TECHNICAL_CONSTANTS]
# ── 标准技术指标周期 ──
atr_length = 14          # ATR 计算周期
adx_length = 14          # ADX 计算周期
rsi_length = 14          # RSI 计算周期
boll_length = 20         # BOLL 计算周期
boll_std = 2             # BOLL 标准差倍数
stoch_k = 9              # Stoch %K 周期
stoch_d = 3              # Stoch %D 平滑周期
kline_scan_window = 60   # K 线形态扫描窗口


[MULTI_HEAD_ARRANGEMENT]
# ── 多头排列评分阈值 ──
full_bull_threshold = 85           # ≥ 此值 → 完全主升浪
trend_acceleration_threshold = 65   # ≥ 此值 → 趋势加速
trend_oscillation_threshold = 45    # ≥ 此值 → 趋势震荡；else → 趋势观望
moving_average_periods = 5,10,20,30,60


[FULL_BULL_SCORING]
# ── MACD 7 维评分权重 ──
weight_zero_axis = 20       # MACD 趋势分（零轴上方位置）
weight_strategy_golden = 15 # 金叉信号强度
weight_momentum = 15        # 柱状动能
weight_dif_slope = 10       # DIF 斜率
weight_divergence = 10      # 背离信号
weight_volume_price = 10    # 量价配合（独立奖励分）
weight_kline_pattern = 10   # K 线组合形态

# ── 综合结论阈值（运行时被 [BACKTEST_CALIBRATED] 覆写） ──
conclusion_full_bull = 80   # 评分 ≥ 此值 → A 级（综合多头）
conclusion_bullish = 60     # 评分 ≥ 此值 → B 级（偏多）
conclusion_oscillate = 40   # 评分 ≥ 此值 → C 级；else → C-（偏空）


[REGIME_DETECTION]
# ── 市场状态分类参数 ──
oscillation_hist_std_ratio = 0.1   # 震荡判定：柱状图 < 此值 × close.std()
top_risk_ma20_deviation = 0.15     # 顶部风险：收盘 > MA20 超此比例
oscillation_min_bars = 30           # 震荡判定最少 K 线数
reversal_lookback = 10              # 反转检测回溯长度


[DIVERGENCE]
# ── 背离检测参数 ──
base_distance = 10         # 极值点搜索基础窗口
strength_threshold = 0.15  # 信号有效强度门限
decay_half_life = 8        # 背离信号半衰期（天）
slope_window = 5           # DIF 斜率回归窗口


[SCORING_PARAMS]
# ── 信号衰减模型 ──
cross_decay_min = 0.3       # 金叉衰减下限（不低于 30%）
kline_decay_days = 10       # K 线形态衰减半衰期（天）
kline_decay_min = 0.2       # K 线衰减下限（不低于 20%）

# ── 波动率归一化 ──
vol_norm_denominator = 0.15 # (DIF-DEA)/ATR ÷ 此值 → vol_factor

# ── Rule 评分偏移量（Walk-Forward 可校准） ──
golden_cross_bonus = 10     # R04: 金叉量价确认加分
divergence_penalty = 20     # R41: 顶背离量缩扣分

# ── 退出策略 ATR 倍数 ──
atr_t1_mult = 4.0           # T1 目标价 = close + ATR × 此值（第一止盈位）
atr_t2_mult = 5.0           # T2 目标价 = close + ATR × 此值（第二止盈位）

# ── 移动止损 ──
trailing_stop_high_ratio = 0.98     # close ≥ 近 N 日最高 × 此值 → 激活
trailing_stop_lookback = 10         # 移动止损价取近 N 日最低
trailing_stop_high_lookback = 20    # 参考高点回溯窗口

# ── 预期盈亏比 ──
expected_return_lookback = 20       # 近 N 日价格区间

# ── 行业估值聚合口径 ──
# aggregate_profitable: 剔除亏损股（中证口径，行业全亏时 PE 为空）
# aggregate_full:      整体法含负利润（申万口径，行业整体亏损时 PE 为负）
industry_valuation_agg_method = aggregate_profitable


[FILTER_RULES]
# ── 弱势股过滤 ──
enable_weak_stock_filter = true
exempt_levels = 完全主升,趋势加速            # Stage 1 趋势豁免
industry_pct_hard = 10                       # Stage 2 硬剔除
industry_pct_d = 30                          # Stage 3 D/C 辅助剔除
industry_pct_exempt = 80                     # Stage 1 单因子豁免

# ── 流动性参数（Gate 2 + Gate 4 共用） ──
liq_w_section = 0.4         # 截面权重（行业内排名）
liq_w_timeseries = 0.4      # 时序权重（自身缩量程度）
liq_w_marketcap = 0.2       # 规模权重（市值因子）
liq_min_discount = 0.3      # 流动性最差时仓位最低比例


[FUND_FLOW]
# ── 资金流统计周期 ──
# 必须设置三个周期，限以下四种组合：
#   3,5,10   → 短中周期（短线交易）
#   3,5,20   → 短长周期（兼顾爆发与趋势）
#   5,10,20  → 中长周期（中线波段，默认）
#   3,10,20  → 分散周期（多级别共振）
fund_flow_periods = 5,10,20


[RESEARCH_REPORT_FILTER]
# ── 研报买入评级过滤 ──
enable_research_report_filter = false
research_report_min_count = 1


[POSITION_SIZING]
# ── 仓位管理 ──
max_single_position = 0.33  # 单票最大仓位比例
default_win_rate = 0.55     # 默认胜率（根据 WFO 历史均值校准，0.50→0.55）
position_b = 0.15           # B 级（偏多）基础仓位
position_c = 0.05           # C 级（多空拉锯）基础仓位
max_industry_exposure = 0.30 # 单一行业最大暴露
max_day_turnover = 0.20      # 单日最大换手率
risk_aversion = 1.0          # 风险厌恶系数
risk_budget = 0.02           # 波动率风险预算
risk_none_multiplier = 1.0   # NONE 风险等级系数：risk_mult[0]=此值，权重=1/risk_mult[lvl]×kelly（逆方差加权）

# ── Gate 5 流动性风控 ──
max_single_impact = 0.02    # 单股冲击成本上限
impact_threshold = 0.01     # 大单冲击阈值
impact_base = 0.002         # 冲击成本基数


[BACKTEST_CALIBRATED]
# ── 回测自动校准参数（Walk-Forward 寻优后自动覆写 FULL_BULL_SCORING 对应项） ──
# 以下参数由回测引擎在 Walk-Forward 校准期间自动搜索最优值，
