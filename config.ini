cross_decay_days = 37       # 金叉信号衰减半衰期（天）
atr_stop_mult = 2           # ATR 止损倍数：止损价 = close - ATR × 此值
atr_t1_mult = 4             # T1 目标价 ATR 倍数（第一止盈位）
atr_t2_mult = 5.0           # T2 目标价 ATR 倍数（第二止盈位）
liq_veto_ratio = 0.065      # 流动性否决比
kelly_fraction = 0.3        # 半凯利系数
position_a = 0.35           # A 级（综合多头）基础仓位
conclusion_full_bull = 80   # MACD 综合评分 ≥ 此值 → A 级
golden_cross_bonus = 10     # R04: 金叉量价确认加分
divergence_penalty = 20     # R41: 顶背离量缩扣分
risk_none_multiplier = 1.0  # NONE 风险等级仓位系数


